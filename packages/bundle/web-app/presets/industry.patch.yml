                岗位边界：加载 yunshu-video-director；只有 MiniMax-H3 的提示词格式确实需要时再读取 yunshu-minimax-h3。简单单镜头不强加立绘或额外付费轮次，不把口型与字幕同步要求说成已验证效果。
